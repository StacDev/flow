openapi: 3.1.0
info:
  title: StacFlow API
  version: 1.0.0-draft
  license:
    name: MIT
    identifier: MIT
  description: >-
    The StacFlow /v1 surface consumed by the SDK and the console's generated
    client. v1-draft: field names freeze at the M1 exit; evolution is additive
    only thereafter. The SSE stream returned by the messages endpoint is
    specified in sse-events.schema.json. Error codes and their failure-class
    attribution live in error-codes.json. The console API (/console/v1/*) is
    added when its routes land (step B1); /v1/ingest lands in M3.
servers:
  - url: https://api.stacflow.ai
security: []

paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Start a session — resolve the deployed agent version, mint a session token.
      security:
        - publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: >-
            unknown_manifest — POST the full manifest to /v1/manifests
            (authenticating with the publishable key), then retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: quota_exceeded — a project quota or plan cap tripped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/sessions/{session_id}/messages:
    post:
      operationId: postMessage
      summary: >-
        Send a user message or continue a turn with tool results. The response
        is one model segment as an SSE stream (see sse-events.schema.json).
      security:
        - sessionToken: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UserMessageBody'
                - $ref: '#/components/schemas/ToolResultsBody'
              discriminator:
                propertyName: kind
                mapping:
                  user_message: '#/components/schemas/UserMessageBody'
                  tool_results: '#/components/schemas/ToolResultsBody'
      responses:
        '200':
          description: >-
            The normalized event stream. Events, framing, and ordering
            invariants are defined by sse-events.schema.json; every stream ends
            with exactly one `done`.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames per contracts/sse-events.schema.json.
        '401':
          description: Includes code token_expired — recreate the session transparently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: thread_not_found — the thread_id does not exist or is not visible to this end user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: >-
            duplicate_message (idempotent replay — the envelope carries the
            existing turn_id in details) or unknown_manifest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: quota_exceeded — a project quota or plan cap tripped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/manifests:
    post:
      operationId: registerManifest
      summary: >-
        Register a capability manifest body for its hash. Manifests are
        immutable and cached by hash forever; registration is idempotent.
        Accepts the publishable key as well as a session token, because the
        409 unknown_manifest recovery on session creation happens before any
        session token exists.
      security:
        - publishableKey: []
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityManifest'
      responses:
        '201':
          description: Registered (or already known).
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest_hash:
                    $ref: '#/components/schemas/ManifestHash'
                required: [manifest_hash]
        '422':
          $ref: '#/components/responses/Error'

  /v1/threads:
    get:
      operationId: listThreads
      summary: List the session end-user's threads, newest first.
      security:
        - sessionToken: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of threads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads:
                    type: array
                    items:
                      $ref: '#/components/schemas/Thread'
                  next_cursor:
                    type: [string, 'null']
                required: [threads]
        '401':
          $ref: '#/components/responses/Error'

  /v1/threads/{thread_id}:
    get:
      operationId: getThread
      summary: Fetch a thread with a page of its messages (server is the source of truth).
      security:
        - sessionToken: []
      parameters:
        - $ref: '#/components/parameters/ThreadId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The thread and one page of messages, oldest first within the page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread:
                    $ref: '#/components/schemas/Thread'
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  next_cursor:
                    type: [string, 'null']
                required: [thread, messages]
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateThread
      summary: Rename a thread.
      security:
        - sessionToken: []
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
              required: [title]
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteThread
      summary: Delete a thread and its messages.
      security:
        - sessionToken: []
      parameters:
        - $ref: '#/components/parameters/ThreadId'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    publishableKey:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer sf_{env}_{projectId}_{keyId}_{secret}'
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA session JWT from POST /v1/sessions; TTL 60 minutes.

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ses_[A-Za-z0-9]+$'
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ThreadId'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Error:
      description: Error envelope; code + failure_class per error-codes.json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ThreadId:
      type: string
      pattern: '^thr_[A-Za-z0-9]+$'
    TurnId:
      type: string
      pattern: '^trn_[A-Za-z0-9]+$'
    MessageId:
      type: string
      pattern: '^msg_[A-Za-z0-9]+$'
    ToolCallId:
      type: string
      pattern: '^tc_[A-Za-z0-9]+$'
    ManifestHash:
      type: string
      pattern: '^cap_[A-Za-z0-9_-]+$'
      description: base64url of the first 128 bits of SHA-256 over canonical manifest JSON.
    FailureClass:
      type: string
      enum: [provider, developer_api, gateway, policy, timeout, cancelled]

    CreateSessionRequest:
      type: object
      properties:
        agent_id:
          type: string
          pattern: '^agt_[A-Za-z0-9]+$'
        environment:
          type: string
          enum: [dev, prod]
        external_user_id:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            End-user identity, HMAC-hashed server-side and never stored raw.
            Developer-supplied when the app has a login; in anonymous mode the
            SDK supplies its persisted device-scoped id here and sets
            `anonymous` (documented as counting installs).
        anonymous:
          type: boolean
          default: false
          description: True when external_user_id is an SDK device id (D19).
        manifest_hash:
          $ref: '#/components/schemas/ManifestHash'
      required: [agent_id, environment, external_user_id]

    Session:
      type: object
      properties:
        session_id:
          type: string
          pattern: '^ses_[A-Za-z0-9]+$'
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
        agent_version:
          $ref: '#/components/schemas/AgentVersionInfo'
      required: [session_id, session_token, expires_at, agent_version]

    AgentVersionInfo:
      type: object
      description: The resolved deployment for (agent, environment) — metadata only, never the prompt.
      properties:
        agent_version_id:
          type: string
          pattern: '^agv_[A-Za-z0-9]+$'
        model:
          type: string
        display_name:
          type: string
      required: [agent_version_id, model]

    UserMessageBody:
      type: object
      properties:
        kind:
          const: user_message
        thread_id:
          $ref: '#/components/schemas/ThreadId'
          description: Absent — the gateway creates a thread.
        client_msg_id:
          type: string
          format: uuid
          description: Outbox idempotency key; a duplicate returns 409 with the existing turn_id.
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UserPart'
        manifest_hash:
          $ref: '#/components/schemas/ManifestHash'
      required: [kind, client_msg_id, parts, manifest_hash]

    UserPart:
      type: object
      description: v1 carries text parts only; attachments are post-v1 (additive).
      properties:
        type:
          const: text
        text:
          type: string
      required: [type, text]

    ToolResultsBody:
      type: object
      description: >-
        Continues a turn whose last segment ended awaiting_client_tools. The
        gateway rejects it if any pending call is unanswered, if a destructive
        result lacks approval (policy), or on jti reuse.
      properties:
        kind:
          const: tool_results
        thread_id:
          $ref: '#/components/schemas/ThreadId'
        turn_id:
          $ref: '#/components/schemas/TurnId'
        results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ToolResultEntry'
      required: [kind, thread_id, turn_id, results]

    ToolResultEntry:
      type: object
      properties:
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        status:
          type: string
          enum: [ok, error, declined]
        result:
          type: object
          additionalProperties: true
          description: Bounded (64 KB); the forModel-reduced value.
        error:
          $ref: '#/components/schemas/ToolError'
        approval:
          $ref: '#/components/schemas/Approval'
      required: [tool_call_id, status]

    ToolError:
      type: object
      properties:
        failure_class:
          $ref: '#/components/schemas/FailureClass'
        code:
          type: string
        message:
          type: string
        upstream:
          type: object
          properties:
            provider:
              type: string
            status:
              type: integer
            code:
              type: string
      required: [failure_class, code, message]

    Approval:
      type: object
      description: Required on every destructive result. Provenance is set by the confirmation surface, never the caller.
      properties:
        provenance:
          type: string
          enum: [human_confirmation, biometric]
        decision_fingerprint:
          type: string
          description: 'sha256 over canonicalJson(args) ‖ renderedCard, prefixed "sha256:".'
        jti:
          type: string
          description: Single-use authorization id; consumed server-side as defense-in-depth.
      required: [provenance, decision_fingerprint, jti]

    CapabilityManifest:
      type: object
      description: >-
        Assembled from the live registries, never hand-written. Canonical JSON
        (sorted keys, UTF-8, no whitespace) hashes to the cap_ ManifestHash.
        build/platform/locale ride as headers, never inside the hashed body.
      properties:
        manifestVersion:
          type: integer
          const: 1
        sdk:
          type: object
          properties:
            package:
              type: string
            version:
              type: string
          required: [package, version]
        catalogs:
          type: array
          items:
            type: string
        components:
          type: object
          additionalProperties:
            type: integer
        tools:
          type: object
          additionalProperties:
            type: object
            properties:
              v:
                type: integer
              capabilityId:
                type: string
              permission:
                type: string
                enum: [read, write, destructive]
              confirmation:
                type: boolean
              biometric:
                type: boolean
              description:
                type: string
                description: Model-facing tool description (dev-plan §6.4).
              args_schema:
                type: object
                additionalProperties: true
                description: >-
                  JSON Schema 2020-12 for the tool's arguments — authored once
                  here; the gateway (or DirectTransport) compiles it per
                  provider (§6.4). The client gate still enforces the full
                  schema, so provider-side laxity never becomes an execution
                  hole.
            required: [v, permission]
        policies:
          type: object
          additionalProperties:
            type: integer
        capabilities:
          type: object
          additionalProperties:
            type: integer
        limits:
          type: object
          additionalProperties:
            type: integer
      required: [manifestVersion, sdk, tools]

    Thread:
      type: object
      properties:
        thread_id:
          $ref: '#/components/schemas/ThreadId'
        title:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: [string, 'null']
          format: date-time
      required: [thread_id, created_at, updated_at]

    Message:
      type: object
      description: One user or assistant message; assistant messages accumulate ordered parts across a turn's segments.
      properties:
        message_id:
          $ref: '#/components/schemas/MessageId'
        thread_id:
          $ref: '#/components/schemas/ThreadId'
        turn_id:
          $ref: '#/components/schemas/TurnId'
        role:
          type: string
          enum: [user, assistant]
        created_at:
          type: string
          format: date-time
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MessagePart'
      required: [message_id, thread_id, turn_id, role, created_at, parts]

    MessagePart:
      oneOf:
        - $ref: '#/components/schemas/TextPart'
        - $ref: '#/components/schemas/ToolCallPart'
        - $ref: '#/components/schemas/UiSurfacePart'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextPart'
          tool_call: '#/components/schemas/ToolCallPart'
          ui_surface: '#/components/schemas/UiSurfacePart'

    TextPart:
      type: object
      properties:
        type:
          const: text
        text:
          type: string
      required: [type, text]

    ToolCallPart:
      type: object
      description: A tool call and (once continued) its result, as persisted for replay.
      properties:
        type:
          const: tool_call
        tool_call_id:
          $ref: '#/components/schemas/ToolCallId'
        tool_name:
          type: string
        executor:
          type: string
          enum: [client, server]
        permission_class:
          type: string
          enum: [read, write, destructive]
        args:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, ok, error, declined]
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/ToolError'
        approval:
          $ref: '#/components/schemas/Approval'
      required: [type, tool_call_id, tool_name, executor, permission_class, args, status]

    UiSurfacePart:
      type: object
      description: >-
        A rendered-UI surface: the ordered A2UI messages that built it, for
        replay.
      properties:
        type:
          const: ui_surface
        surface_id:
          type: string
        a2ui:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [type, surface_id, a2ui]

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: From error-codes.json.
            failure_class:
              $ref: '#/components/schemas/FailureClass'
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
              description: 'Code-specific payload, e.g. {"turn_id": ...} on duplicate_message.'
          required: [code, failure_class, message, retryable]
      required: [error]
