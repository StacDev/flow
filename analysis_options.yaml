# Governs tool/ and the stacflow package. packages/flow_ui, its example and
# playground keep their own flutter_lints files (nearest file wins).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/build/**"
    - "**/lib/src/generated/**"
    - docs/**
  errors:
    public_member_api_docs: ignore
